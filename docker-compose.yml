# Local Stage 4 (Docker) practice environment — NOT the production topology.
# Wires the app to exactly ONE local database (the 'shelter' connection,
# DB2), matching the plan's own scope: the real 5-connection setup only
# exists on the Tailscale-connected Proxmox fleet (see CLAUDE.md's Database
# Connection Mapping). DB1/DB3/DB4/DB5 are left pointed at their real
# Tailscale IPs (config/database.php's own defaults) — unreachable from this
# Docker network, so they simply go unused rather than risk touching
# production from a local container.
services:
  app:
    build: .
    image: animal-shelter-workshop:latest
    volumes:
      - app-public:/var/www/html/public
    environment:
      APP_NAME: ASW
      APP_ENV: local
      APP_KEY: "base64:M0OUllc66N9E5MtY5VzOs0v29nIM+2EWbzj+z1V9+5Y="
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8080"

      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite

      # 'shelter' (DB2, mysql driver) -> this compose's local db service
      DB2_HOST: db
      DB2_PORT: 3306
      DB2_DATABASE: workshop_2_docker
      DB2_USERNAME: docker
      DB2_PASSWORD: docker

      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      MAIL_MAILER: log
      BROADCAST_CONNECTION: log
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
    depends_on:
      db:
        condition: service_healthy

  webserver:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - app-public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: docker
      MYSQL_DATABASE: workshop_2_docker
      MYSQL_USER: docker
      MYSQL_PASSWORD: docker
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdocker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app-public:
  db-data:
