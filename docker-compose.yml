# Stage 4 (Docker) practice environment, wired to all 5 real DB connections
# using DEV credentials (workshop_2_dev — see .env), not production ones.
# Local/docker-compose always uses .env's dev creds; the real prod
# credentials only ever get used on k3s, injected live from Vault via the
# Agent Injector (see k8s/deployment.yaml) — never through docker-compose,
# never hardcoded here.
#
# Reaching the 5 real Tailscale hosts from a container works because the
# Docker host (WSL) is itself a Tailscale node — outbound traffic is NAT'd
# through the host's own tailscale0 interface, no sidecar needed (confirmed
# live: `nc -zv` from inside the app container reached all 3 migrated hosts
# with zero extra config). Running this same image on a machine that isn't
# Tailscale-authorized would fail these 5 connections.
services:
  app:
    build: .
    image: animal-shelter-workshop:latest
    volumes:
      - app-public:/var/www/html/public
    env_file:
      - .env
    environment:
      APP_NAME: ASW
      APP_ENV: local
      APP_KEY: "base64:M0OUllc66N9E5MtY5VzOs0v29nIM+2EWbzj+z1V9+5Y="
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8080"

      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite

      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      MAIL_MAILER: log
      BROADCAST_CONNECTION: log
      LOG_CHANNEL: stack
      LOG_LEVEL: debug

  webserver:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - app-public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  app-public:
