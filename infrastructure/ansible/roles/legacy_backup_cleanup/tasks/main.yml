---
# Per-host backup timers retired in favor of one coordinated backup run from
# app-server (php artisan db:backup) — see docs/10-backups.md for why:
# per-host dumps never left the VM, never covered msi, and had no
# cross-database integrity check. These tasks stop and remove the old unit
# on already-provisioned hosts; they don't reinstall it. Only needed on the
# 3 original DB hosts (mysql/mariadb/postgres) — the -2 containers were
# created after centralization and never had this timer in the first place.
- name: Stop and disable the retired per-host backup timer
  systemd:
    name: workshop-db-backup.timer
    state: stopped
    enabled: false
  ignore_errors: true

- name: Remove the retired backup systemd timer unit
  file:
    path: /etc/systemd/system/workshop-db-backup.timer
    state: absent
  notify: Reload systemd (backup)

- name: Remove the retired backup systemd service unit
  file:
    path: /etc/systemd/system/workshop-db-backup.service
    state: absent
  notify: Reload systemd (backup)

- name: Remove the retired backup script
  file:
    path: /usr/local/bin/backup-workshop-db.sh
    state: absent

# /var/backups/workshop_2 is left in place — delete manually once the
# centralized backup on app-server is confirmed working.
