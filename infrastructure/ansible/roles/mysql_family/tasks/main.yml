---
# Shared by linux-{mysql,mysql-2,mariadb,mariadb-2}.yml. Each playbook sets:
#   mysql_family_engine          mysql | mariadb
#   mysql_family_package         mysql-server | mariadb-server
#   mysql_family_service         mysql | mariadb
#   mysql_family_config_path     path to the bind-address config file
#   mysql_family_bootstrap_root_auth   true only on hosts that need root
#                                 switched from socket auth to a password
#                                 (the two original hosts; the -2 containers
#                                 were adopted already-configured)
#   mysql_family_extra_config_lines    engine-specific config lines, e.g.
#                                 MySQL's log_bin_trust_function_creators
#   mysql_family_priv_extra       the extra grant needed for mysqldump
#                                 --routines to read a routine whose DEFINER
#                                 isn't the connecting user — MySQL 8 has the
#                                 SHOW_ROUTINE dynamic privilege ("*.*:SHOW_ROUTINE"),
#                                 MariaDB doesn't and uses the classic
#                                 mysql.proc:SELECT escape hatch instead
- name: "Install {{ mysql_family_engine }} and Python MySQL client"
  apt:
    name:
      - "{{ mysql_family_package }}"
      - python3-pymysql
    state: present
    update_cache: true

- name: "Start and enable {{ mysql_family_service }}"
  service:
    name: "{{ mysql_family_service }}"
    state: started
    enabled: true

# A fresh install leaves root@localhost on auth_socket/unix_socket (no
# password, OS-user-matched login only) — every task below authenticates
# with login_password, which that plugin ignores. unix_socket auth only ever
# works over an actual AF_UNIX connection (login_unix_socket) — once this
# succeeds the plugin switches to mysql_native_password and the same socket
# attempt starts failing on every later re-run, so it's allowed to fail here;
# if root auth is genuinely broken the next task (which needs login_password)
# fails loudly instead.
- name: "Bootstrap {{ mysql_family_engine }} root to password auth (fresh installs default to socket auth)"
  community.mysql.mysql_user:
    name: root
    host: localhost
    plugin: mysql_native_password
    password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    state: present
  failed_when: false
  when: mysql_family_bootstrap_root_auth

- name: Allow remote connections
  lineinfile:
    path: "{{ mysql_family_config_path }}"
    regexp: '^bind-address'
    line: "bind-address = 0.0.0.0"
  notify: "Restart {{ mysql_family_service }}"

- name: Apply engine-specific config lines
  lineinfile:
    path: "{{ mysql_family_config_path }}"
    insertafter: '^bind-address'
    line: "{{ item }}"
  loop: "{{ mysql_family_extra_config_lines }}"
  notify: "Restart {{ mysql_family_service }}"

- name: Flush handlers so config is applied before DB tasks
  meta: flush_handlers

- name: "Create {{ db_name }} database"
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"

# Must live in this SAME priv string, not a separate task/grant: mysql_user's
# default append_privs:false revokes anything not listed here on every run,
# which is exactly how this grant went missing between the 2026-07-20 manual
# fix and 2026-07-26 (applied by hand outside Ansible, silently wiped by the
# next re-provision).
- name: "Create {{ db_user }} user (allow from any host)"
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    host: "%"
    priv: "{{ db_name }}.*:ALL/{{ mysql_family_priv_extra }}"
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
