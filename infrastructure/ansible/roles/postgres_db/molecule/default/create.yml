---
- name: Create
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    molecule_ct_id: 199
    molecule_ct_hostname: molecule-postgres-test
    proxmox_ssh_target: "root@100.97.8.93"
    molecule_pubkey: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
    # Same reusable Tailscale key Terraform uses (infrastructure/terraform/terraform.tfvars,
    # gitignored) — export MOLECULE_TAILSCALE_AUTH_KEY before running
    # `molecule create`/`test`. Joining Tailscale directly means Molecule's
    # instance_config.yml (address/user/port/identity_file only, no room for
    # a custom ProxyCommand) is enough on its own: a plain Tailscale IP is
    # directly reachable from this control node, unlike a bare LAN IP.
    molecule_tailscale_auth_key: "{{ lookup('env', 'MOLECULE_TAILSCALE_AUTH_KEY') }}"

  tasks:
    - name: Destroy any leftover container from a previous failed run
      ansible.builtin.shell: >
        ssh -o StrictHostKeyChecking=no {{ proxmox_ssh_target }}
        "pct stop {{ molecule_ct_id }} 2>/dev/null; pct destroy {{ molecule_ct_id }} 2>/dev/null; true"
      changed_when: false

    # Same bridge/VLAN/storage shape as the real DB hosts (tag 20 — DB tier),
    # just a throwaway ID and hostname.
    # --nameserver 8.8.8.8 matters here: this VLAN's DHCP hands out
    # Tailscale's stub resolver (100.100.100.100) by default, which only
    # answers queries once tailscaled is actually running — a chicken-and-egg
    # deadlock for the apt-get/curl calls below that have to happen *before*
    # Tailscale is installed. The real DB hosts avoid this the same way (see
    # their `pct config`, which all show nameserver: 8.8.8.8 explicitly).
    - name: Create scratch LXC container from the Ubuntu 24.04 template
      ansible.builtin.shell: >
        ssh {{ proxmox_ssh_target }} "pct create {{ molecule_ct_id }}
        local:vztmpl/ubuntu-24.04-standard_24.04-2_amd64.tar.zst
        --hostname {{ molecule_ct_hostname }}
        --cores 2 --memory 2048 --swap 512
        --rootfs local:8
        --net0 name=eth0,bridge=vmbr0,ip=dhcp,tag=20
        --nameserver 8.8.8.8
        --unprivileged 1
        --features nesting=1"

    # Same two raw LXC lines the real Tailscale-joined DB containers carry
    # (see docs/devops-plan/terraform-state-import-and-module.md) — without
    # them /dev/net/tun doesn't exist and tailscaled crash-loops
    # ("CreateTUN(\"tailscale0\") failed; /dev/net/tun does not exist").
    - name: Add TUN device passthrough to the container's raw LXC config
      ansible.builtin.shell: >
        ssh {{ proxmox_ssh_target }}
        "printf 'lxc.cgroup2.devices.allow: c 10:200 rwm\nlxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file\n' >> /etc/pve/lxc/{{ molecule_ct_id }}.conf"

    - name: Start the container
      ansible.builtin.shell: ssh {{ proxmox_ssh_target }} "pct start {{ molecule_ct_id }}"

    - name: Wait for the container to get a LAN IPv4 address (needed for pct exec's apt/network access)
      ansible.builtin.shell: >
        ssh {{ proxmox_ssh_target }}
        "pct exec {{ molecule_ct_id }} -- sh -c \"ip -4 addr show eth0 | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -1\""
      register: ct_lan_ip
      until: ct_lan_ip.rc == 0 and ct_lan_ip.stdout | trim | length > 0
      retries: 15
      delay: 3
      changed_when: false

    - name: Install openssh-server and curl inside the container
      ansible.builtin.shell: >
        ssh {{ proxmox_ssh_target }}
        "pct exec {{ molecule_ct_id }} -- bash -c \"apt-get update -qq && apt-get install -y -qq openssh-server curl && systemctl enable --now ssh\""

    - name: Authorize our control node's SSH key inside the container
      ansible.builtin.shell: >
        ssh {{ proxmox_ssh_target }}
        "pct exec {{ molecule_ct_id }} -- bash -c \"mkdir -p /root/.ssh && chmod 700 /root/.ssh &&
        echo {{ molecule_pubkey | quote }} > /root/.ssh/authorized_keys &&
        chmod 600 /root/.ssh/authorized_keys\""

    - name: Install Tailscale and join the tailnet
      ansible.builtin.shell: >
        ssh {{ proxmox_ssh_target }}
        "pct exec {{ molecule_ct_id }} -- bash -c \"curl -fsSL https://tailscale.com/install.sh | sh &&
        systemctl enable --now tailscaled &&
        for i in 1 2 3 4 5 6 7 8; do
        tailscale up --authkey={{ molecule_tailscale_auth_key }} --hostname={{ molecule_ct_hostname }} && break;
        sleep 2;
        done\""

    - name: Get the container's Tailscale IPv4 address
      ansible.builtin.shell: >
        ssh {{ proxmox_ssh_target }} "pct exec {{ molecule_ct_id }} -- tailscale ip -4"
      register: ct_ts_ip
      until: ct_ts_ip.rc == 0 and ct_ts_ip.stdout | trim | length > 0
      retries: 10
      delay: 3
      changed_when: false

    - name: Add the new container to the in-memory inventory for this play
      add_host:
        name: molecule-postgres-test
        groups: [molecule]
        ansible_host: "{{ ct_ts_ip.stdout | trim }}"
        ansible_user: root

    - name: Wait for SSH to actually be reachable over Tailscale
      ansible.builtin.wait_for:
        host: "{{ ct_ts_ip.stdout | trim }}"
        port: 22
        timeout: 60
      delegate_to: localhost

    # instance_config.yml only supports address/user/port/identity_file — no
    # room for a custom ProxyCommand, which is exactly why this scenario joins
    # Tailscale directly instead of routing through Proxmox as a jump host.
    - name: Persist Molecule's own instance bookkeeping
      copy:
        content: |
          - instance: molecule-postgres-test
            address: {{ ct_ts_ip.stdout | trim }}
            user: root
            port: 22
            identity_file: ~/.ssh/id_ed25519
        dest: "{{ molecule_instance_config }}"
