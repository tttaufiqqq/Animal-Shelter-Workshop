---
# Tailscale's default netfilter management inserts its own `ts-input` chain
# at the top of iptables INPUT, which unconditionally ACCEPTs all traffic
# arriving on tailscale0 before ufw's chains ever run — silently turning
# every `from_ip`-scoped rule below into a no-op for anyone on the tailnet,
# not just the intended source. Turning netfilter management off (these
# hosts advertise no subnet routes, so nothing else depends on it) hands
# tailscale0 back to ufw like any other interface.
- name: Tailscale — disable netfilter management so ufw actually governs tailscale0
  ansible.builtin.command: tailscale set --netfilter-mode=off
  changed_when: false

- name: UFW — default deny incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: UFW — default allow outgoing
  community.general.ufw:
    default: allow
    direction: outgoing

- name: UFW — SSH from admin machine via Tailscale only
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in
    from_ip: "{{ admin_machine_tailscale_ip }}"
    to_port: "22"
    proto: tcp
    comment: "SSH from msi admin machine"

- name: UFW — SSH from linux-gh-runner (CD) via Tailscale only
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in
    from_ip: "{{ gh_runner_tailscale_ip }}"
    to_port: "22"
    proto: tcp
    comment: "SSH from linux-gh-runner (CD)"

- name: "UFW — {{ db_firewall_service_name }} from app-server via Tailscale only"
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in
    from_ip: "{{ app_server_tailscale_ip }}"
    to_port: "{{ db_firewall_port }}"
    proto: tcp
    comment: "{{ db_firewall_service_name }} from app-server"

- name: "UFW — {{ db_firewall_service_name }} from linux-k3s via Tailscale only"
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in
    from_ip: "{{ k3s_tailscale_ip }}"
    to_port: "{{ db_firewall_port }}"
    proto: tcp
    comment: "{{ db_firewall_service_name }} from linux-k3s"

# tests.yml connects linux-gh-runner directly to these 5 hosts' real DB
# ports (workshop_2_test databases) to run the backend/browser test suites.
# This only ever worked before because Tailscale's netfilter management was
# silently bypassing ufw entirely (see the netfilter-mode=off task above) —
# fixed in a prior session, which correctly closed that hole but also
# revealed gh-runner never had an explicit DB-port rule of its own, only
# SSH. Same explicit-allowlist treatment as app-server/linux-k3s above, not
# a broad relaxation.
- name: "UFW — {{ db_firewall_service_name }} from linux-gh-runner (CI tests) via Tailscale only"
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in
    from_ip: "{{ gh_runner_tailscale_ip }}"
    to_port: "{{ db_firewall_port }}"
    proto: tcp
    comment: "{{ db_firewall_service_name }} from linux-gh-runner (CI tests)"

# docs/19-devops-practice — linux-observability's blackbox_exporter needs
# to TCP-probe this port to show real DB connectivity in Grafana (not just
# "is the VM up", which node_exporter already covers). Same explicit-
# allowlist pattern as every other rule here.
- name: "UFW — {{ db_firewall_service_name }} from linux-observability (connectivity probe) via Tailscale only"
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in
    from_ip: "{{ observability_tailscale_ip }}"
    to_port: "{{ db_firewall_port }}"
    proto: tcp
    comment: "{{ db_firewall_service_name }} from linux-observability (probe)"

- name: UFW — enable
  community.general.ufw:
    state: enabled
