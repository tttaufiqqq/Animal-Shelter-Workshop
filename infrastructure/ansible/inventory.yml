# Hosts use Tailscale MagicDNS hostnames (set by cloud-init hostname field).
# If MagicDNS is not enabled, replace ansible_host values with Tailscale IPs
# from: tailscale status (run on any Tailscale node after terraform apply).

all:
  children:
    app:
      hosts:
        app-server:
          ansible_host: app-server

    mysql_hosts:
      hosts:
        linux-mysql:
          ansible_host: linux-mysql
        linux-mysql-2:
          ansible_host: linux-mysql-2

    mariadb_hosts:
      hosts:
        linux-mariadb:
          ansible_host: linux-mariadb
        linux-mariadb-2:
          ansible_host: linux-mariadb-2

    postgres_hosts:
      hosts:
        linux-postgres:
          ansible_host: linux-postgres

    databases:
      children:
        mysql_hosts:
        mariadb_hosts:
        postgres_hosts:

    # Homelab-level CTs/VMs this repo's Ansible also manages (Stage 2) —
    # not part of the app stack itself, unlike everything above.
    linux_vault:
      hosts:
        linux-vault:
          ansible_host: linux-vault

    linux_gh_runner:
      hosts:
        linux-gh-runner:
          ansible_host: linux-gh-runner

    linux_mini_io:
      hosts:
        linux-mini-io:
          ansible_host: linux-mini-io

    linux_mongodb:
      hosts:
        linux-mongodb:
          ansible_host: linux-mongodb

    homelab_hosts:
      children:
        linux_vault:
        linux_gh_runner:
        linux_mini_io:
        linux_mongodb:
