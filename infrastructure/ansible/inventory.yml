# Hosts use Tailscale MagicDNS hostnames (set by cloud-init hostname field).
# If MagicDNS is not enabled, replace ansible_host values with Tailscale IPs
# from: tailscale status (run on any Tailscale node after terraform apply).

all:
  children:
    app:
      hosts:
        app-server:
          ansible_host: app-server

    mysql_hosts:
      hosts:
        linux-mysql:
          ansible_host: linux-mysql
        linux-mysql-2:
          ansible_host: linux-mysql-2

    mariadb_hosts:
      hosts:
        linux-mariadb:
          ansible_host: linux-mariadb
        linux-mariadb-2:
          ansible_host: linux-mariadb-2

    postgres_hosts:
      hosts:
        linux-postgres:
          ansible_host: linux-postgres

    databases:
      children:
        mysql_hosts:
        mariadb_hosts:
        postgres_hosts:

    # Homelab-level CTs/VMs this repo's Ansible also manages (Stage 2) —
    # not part of the app stack itself, unlike everything above.
    linux_vault:
      hosts:
        linux-vault:
          ansible_host: linux-vault

    linux_gh_runner:
      hosts:
        linux-gh-runner:
          ansible_host: linux-gh-runner

    linux_mini_io:
      hosts:
        linux-mini-io:
          ansible_host: linux-mini-io

    linux_mongodb:
      hosts:
        linux-mongodb:
          ansible_host: linux-mongodb

    linux_k3s:
      hosts:
        linux-k3s:
          ansible_host: linux-k3s

    # plans/07-k3s-production-cutover-plan (monitoring/observability
    # follow-on) — the 2 nodes plan 06/07 added, brought into the same
    # fleet-wide node_exporter/Promtail coverage as node 1 always had.
    linux_k3s_2:
      hosts:
        linux-k3s-2:
          ansible_host: linux-k3s-2
          ansible_user: root

    linux_k3s_3:
      hosts:
        linux-k3s-3:
          ansible_host: linux-k3s-3
          ansible_user: root

    # Stage 6 — Observability CT (Prometheus/Grafana/Loki/Alertmanager).
    linux_observability:
      hosts:
        linux-observability:
          ansible_host: linux-observability

    homelab_hosts:
      children:
        linux_vault:
        linux_gh_runner:
        linux_mini_io:
        linux_mongodb:
        linux_k3s:
        linux_k3s_2:
        linux_k3s_3:
        linux_observability:

    # Every host node_exporter/Promtail get installed on for Stage 6 —
    # the whole fleet except opnsense (BSD, not Ansible-managed) and the
    # Proxmox host itself (not a guest).
    monitoring_targets:
      children:
        app:
        databases:
        linux_vault:
        linux_gh_runner:
        linux_mini_io:
        linux_mongodb:
        linux_k3s:
        linux_k3s_2:
        linux_k3s_3:
        linux_observability:
