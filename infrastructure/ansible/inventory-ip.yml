# IP-based inventory for control nodes that can't resolve Tailscale MagicDNS
# hostnames — e.g. linux-gh-runner, whose DNS is pinned to 8.8.8.8 (see the
# homelab repo's docs/09-github-actions-runner/actions-runner-setup.md,
# Issue 5). Same host/group structure as inventory.yml, but with Tailscale
# IPs and an explicit ansible_user per host (see CLAUDE.md's Server Topology
# table and ~/.ssh/config for where these values come from — SSH usernames
# differ per host and don't match ansible.cfg's global remote_user).
#
# Safe to commit (unlike the old .scratch-inventory-ip-override.yml): these
# IPs are already published in CLAUDE.md's topology table.

all:
  children:
    app:
      hosts:
        app-server:
          ansible_host: 100.100.123.90
          ansible_user: taufiq

    mysql_hosts:
      hosts:
        linux-mysql:
          ansible_host: 100.78.80.42
          ansible_user: linux-mysql
        linux-mysql-2:
          ansible_host: 100.123.221.89
          ansible_user: linux-mysql-2

    mariadb_hosts:
      hosts:
        linux-mariadb:
          ansible_host: 100.112.107.1
          ansible_user: linux-mariadb
        linux-mariadb-2:
          ansible_host: 100.97.35.29
          ansible_user: linux-mariadb-2

    postgres_hosts:
      hosts:
        linux-postgres:
          ansible_host: 100.72.187.124
          ansible_user: linux-postgres

    databases:
      children:
        mysql_hosts:
        mariadb_hosts:
        postgres_hosts:

    # Homelab-level CTs/VMs this repo's Ansible also manages (Stage 2) — see
    # proxmox-homelab-taufiq/docs/{07-vault,09-github-actions-runner,05-minio,
    # 06-mongodb}/ for how each was originally set up by hand.
    linux_vault:
      hosts:
        linux-vault:
          ansible_host: 100.112.41.113
          ansible_user: linux-vault

    linux_gh_runner:
      hosts:
        linux-gh-runner:
          ansible_host: 100.72.6.40
          ansible_user: linux-gh-runner

    linux_mini_io:
      hosts:
        linux-mini-io:
          ansible_host: 100.73.172.85
          ansible_user: linux-mini-io

    linux_mongodb:
      hosts:
        linux-mongodb:
          ansible_host: 100.82.200.94
          ansible_user: linux-mongodb

    linux_k3s:
      hosts:
        linux-k3s:
          ansible_host: 100.109.241.125
          ansible_user: linux-k3s

    # Stage 6 — Observability CT (Prometheus/Grafana/Loki/Alertmanager).
    linux_observability:
      hosts:
        linux-observability:
          ansible_host: 100.77.185.81
          ansible_user: linux-observability

    homelab_hosts:
      children:
        linux_vault:
        linux_gh_runner:
        linux_mini_io:
        linux_mongodb:
        linux_k3s:
        linux_observability:

    # Every host node_exporter/Promtail get installed on for Stage 6.
    monitoring_targets:
      children:
        app:
        databases:
        linux_vault:
        linux_gh_runner:
        linux_mini_io:
        linux_mongodb:
        linux_k3s:
        linux_observability:
