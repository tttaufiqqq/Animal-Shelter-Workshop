---
# Stage 6 (Observability) — Prometheus + Grafana on linux-observability
# (Proxmox CT 114, VLAN 80). Loki/Alertmanager come in later plays on the
# same host, added incrementally as each Stage 6 checklist item lands.
- name: Provision linux-observability — Prometheus + Grafana
  hosts: linux-observability
  become: true

  tasks:
    - name: Install Prometheus (Ubuntu universe package)
      apt:
        name: prometheus
        state: present
        update_cache: true

    - name: Render prometheus.yml scrape config (every fleet node_exporter)
      template:
        src: ../templates/prometheus.yml.j2
        dest: /etc/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        mode: "0644"
      notify: Restart prometheus

    - name: Ensure prometheus is enabled and running
      service:
        name: prometheus
        state: started
        enabled: true

    # ── Grafana — not in Ubuntu's repos, needs Grafana Labs' own apt repo ──
    - name: Install Grafana apt repo dependencies
      apt:
        name: [apt-transport-https, software-properties-common, wget, gpg]
        state: present

    - name: Install Grafana apt signing key
      shell: wget -q -O - https://apt.grafana.com/gpg.key | gpg --dearmor -o /etc/apt/keyrings/grafana.gpg
      args:
        creates: /etc/apt/keyrings/grafana.gpg

    - name: Add Grafana apt repository (also carries loki/promtail)
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main"
        filename: grafana
        state: present

    - name: Install Grafana
      apt:
        name: grafana
        state: present
        update_cache: true

    - name: Ensure grafana-server is enabled and running
      service:
        name: grafana-server
        state: started
        enabled: true

    # ── Firewall — Prometheus (9090) + Grafana (3000) from Tailscale only ──
    - name: Check ufw is installed
      command: which ufw
      register: ufw_present
      changed_when: false
      failed_when: false

    - name: UFW — default deny incoming
      community.general.ufw:
        default: deny
        direction: incoming
      when: ufw_present.rc == 0

    - name: UFW — default allow outgoing
      community.general.ufw:
        default: allow
        direction: outgoing
      when: ufw_present.rc == 0

    - name: UFW — SSH from Tailscale
      community.general.ufw:
        rule: allow
        interface: tailscale0
        direction: in
        to_port: "22"
        proto: tcp
        comment: "SSH from Tailscale"
      when: ufw_present.rc == 0

    - name: UFW — Prometheus from Tailscale
      community.general.ufw:
        rule: allow
        interface: tailscale0
        direction: in
        to_port: "9090"
        proto: tcp
        comment: "Prometheus UI from Tailscale"
      when: ufw_present.rc == 0

    - name: UFW — Grafana from Tailscale
      community.general.ufw:
        rule: allow
        interface: tailscale0
        direction: in
        to_port: "3000"
        proto: tcp
        comment: "Grafana UI from Tailscale"
      when: ufw_present.rc == 0

    # ── Loki — log aggregation, receives pushes from every fleet Promtail ──
    - name: Install Loki
      apt:
        name: loki
        state: present
        update_cache: true

    - name: Render Loki config
      template:
        src: ../templates/loki-config.yml.j2
        dest: /etc/loki/config.yml
        owner: loki
        group: nogroup
        mode: "0644"
      notify: Restart loki

    - name: Ensure loki data dir exists with correct ownership
      file:
        path: /var/lib/loki
        state: directory
        owner: loki
        group: nogroup
        mode: "0750"

    - name: Ensure loki is enabled and running
      service:
        name: loki
        state: started
        enabled: true

    - name: UFW — Loki push API from Tailscale
      community.general.ufw:
        rule: allow
        interface: tailscale0
        direction: in
        to_port: "3100"
        proto: tcp
        comment: "Loki push API from Tailscale (fleet Promtail)"
      when: ufw_present.rc == 0

    # ── Alertmanager — routes firing alerts to Telegram ──
    - name: Install prometheus-alertmanager
      apt:
        name: prometheus-alertmanager
        state: present
        update_cache: true

    - name: Render alertmanager.yml (Telegram receiver)
      template:
        src: ../templates/alertmanager.yml.j2
        dest: /etc/prometheus/alertmanager.yml
        owner: root
        group: prometheus
        mode: "0640"
      notify: Restart alertmanager

    - name: Ensure prometheus rules directory exists
      file:
        path: /etc/prometheus/rules
        state: directory
        owner: prometheus
        group: prometheus
        mode: "0755"

    - name: Deploy alert rules (InstanceDown, HighDiskUsage)
      copy:
        src: ../files/prometheus-alert-rules.yml
        dest: /etc/prometheus/rules/fleet.yml
        owner: prometheus
        group: prometheus
        mode: "0644"
      notify: Restart prometheus

    - name: Ensure alertmanager is enabled and running
      service:
        name: prometheus-alertmanager
        state: started
        enabled: true

    - name: UFW — Alertmanager UI from Tailscale
      community.general.ufw:
        rule: allow
        interface: tailscale0
        direction: in
        to_port: "9093"
        proto: tcp
        comment: "Alertmanager UI from Tailscale"
      when: ufw_present.rc == 0

    - name: UFW — enable
      community.general.ufw:
        state: enabled
      when: ufw_present.rc == 0

  handlers:
    - name: Restart prometheus
      service:
        name: prometheus
        state: restarted

    - name: Restart loki
      service:
        name: loki
        state: restarted

    - name: Restart alertmanager
      service:
        name: prometheus-alertmanager
        state: restarted
