- name: Provision linux-mariadb (MariaDB)
  hosts: linux-mariadb
  become: true

  vars:
    # workshop_2_prod, not workshop_2 — DBA-style prod/dev split: this server
    # also carries a workshop_2_dev database (dev environment's local .env,
    # not managed by this playbook) alongside the prod one this playbook
    # provisions. See CLAUDE.md's Database Connection Mapping.
    db_name: workshop_2_prod
    db_user: workshop_2_prod
    # Sourced from Vault (group_vars/all.yml's asw_secrets) — was hardcoded
    # here and in env-app.j2 as two copies of the same literal, free to drift.
    db_password: "{{ asw_secrets.db_password }}"

    mysql_family_engine: mariadb
    mysql_family_package: mariadb-server
    mysql_family_service: mariadb
    mysql_family_config_path: /etc/mysql/mariadb.conf.d/50-server.cnf
    mysql_family_bootstrap_root_auth: true
    mysql_family_extra_config_lines: []
    # MariaDB has no SHOW_ROUTINE dynamic privilege (that's MySQL 8 only),
    # hence the classic SELECT-on-mysql.proc escape hatch instead.
    mysql_family_priv_extra: "mysql.proc:SELECT"

  roles:
    - role: mysql_family
    - role: db_firewall
      vars:
        db_firewall_port: 3306
        db_firewall_service_name: MariaDB
    - role: legacy_backup_cleanup
