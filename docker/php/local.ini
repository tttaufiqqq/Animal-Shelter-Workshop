; Matches infrastructure/ansible/playbooks/app-server.yml's PHP-FPM tuning —
; package defaults (2M/8M) sit below the report form's 5MB-per-image limit.
upload_max_filesize = 8M
post_max_size = 30M

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
