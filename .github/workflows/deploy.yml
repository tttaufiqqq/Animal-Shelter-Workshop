name: Deploy

# Auto-fires after Tests (.github/workflows/tests.yml) succeeds on main — see
# docs/12-cd.md for the full design. workflow_dispatch exists only as an
# escape hatch (forced re-run), never as a required step.
#
# app-server (VM 101) is no longer a deploy target as of plan 06's Stage 5/
# the app-server shutdown that followed it — k3s (build-and-push-k3s-images
# below, GitOps-synced by ArgoCD) is the real serving path now. The
# deploy-app/rollback/no-rollback-target jobs that used to provision and
# smoke-test app-server directly were removed for exactly that reason: with
# app-server powered off, they'd fail on every single run. See
# proxmox-homelab-taufiq/docs/19-devops-practice for the full writeup.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA or branch to deploy'
        default: main
      force_full:
        description: 'Run the full DB playbooks regardless of changed paths'
        type: boolean
        default: false

# The fleet these jobs converge is real shared infrastructure, not per-run
# containers — two deploys at once would stomp on each other the same way
# tests.yml's concurrency group protects the 5 shared test databases.
concurrency:
  group: deploy-fleet
  cancel-in-progress: false

jobs:
  # workflow_run also fires for PR test runs — this guard is what keeps a PR
  # from ever deploying. Only a successful *push to main* (or an explicit
  # manual dispatch) reaches the jobs below.
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, linux, homelab, tailnet]
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.route.outputs.target_sha }}
      infra_db: ${{ steps.route.outputs.infra_db }}
    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          # On workflow_run, checkout otherwise defaults to the default
          # branch tip, not the commit that was actually tested.
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}
          fetch-depth: 0

      - name: Read CD secrets from Vault
        run: |
          set -euo pipefail
          set -a; source ~/actions-runner/.env; set +a
          BECOME_PASS=$(vault kv get -field=become_password secret/asw-cd)
          SSH_KEY=$(vault kv get -field=ssh_private_key secret/asw-cd)
          ROLE_ID=$(vault kv get -field=vault_role_id secret/asw-cd)
          SECRET_ID=$(vault kv get -field=vault_secret_id secret/asw-cd)
          for v in "$BECOME_PASS" "$ROLE_ID" "$SECRET_ID"; do
            echo "::add-mask::$v"
          done
          mkdir -p "$RUNNER_TEMP/cd"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/cd/cd_key"
          chmod 600 "$RUNNER_TEMP/cd/cd_key"
          {
            echo "ANSIBLE_BECOME_PASS=$BECOME_PASS"
            echo "VAULT_ROLE_ID=$ROLE_ID"
            echo "VAULT_SECRET_ID=$SECRET_ID"
          } >> "$GITHUB_ENV"

      # infra_db routing only now — app-server's own "diff against what's
      # live" routing (last_good_sha etc.) went away with deploy-app itself.
      - name: Determine target commit and path-based routing
        id: route
        working-directory: infrastructure/ansible
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse HEAD)

          INFRA_DB=false

          if [ "${{ inputs.force_full }}" = "true" ]; then
            echo "force_full requested — running the full DB playbooks."
            INFRA_DB=true
          else
            # HEAD~1 is a reasonable proxy for "since the last push" now that
            # there's no app-server marker file to diff against — this repo's
            # pushes are effectively one commit at a time in practice.
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>&1) || CHANGED=""
            echo "Changed files since the previous commit:"
            echo "$CHANGED"
            if echo "$CHANGED" | grep -qE '^infrastructure/ansible/(playbooks/linux-.*\.yml|group_vars/|roles/)'; then
              INFRA_DB=true
            fi
          fi

          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "infra_db=$INFRA_DB" >> "$GITHUB_OUTPUT"

      - name: Clean up temp SSH key
        if: always()
        run: shred -u "$RUNNER_TEMP/cd/cd_key" 2>/dev/null || rm -f "$RUNNER_TEMP/cd/cd_key"

  # k3s multi-node GitOps automation (proxmox-homelab-taufiq plan 06 Stage
  # 4): builds both asw-app images (app/php-fpm, nginx — see Dockerfile's
  # `runtime`/`nginx` targets and plans/06's Stage 2 split), tags with the
  # commit SHA (never `latest` — ArgoCD needs an actual diff in git to sync
  # anything), pushes to Docker Hub, then commits the tag bump straight back
  # into k8s/deployment.yaml + k8s/nginx-deployment.yaml. This is now the
  # real deploy path for the app itself (k3s, ArgoCD-synced) — not gated by
  # infra_db routing, since a plain app-code push is the common case this
  # exists for.
  #
  # The `[skip ci]` in the bump commit message is what keeps this from
  # looping forever: GitHub Actions natively skips push-triggered workflow
  # runs (tests.yml here) for any commit whose message contains it, so the
  # bump commit never re-triggers Tests -> Deploy -> this job again.
  build-and-push-k3s-images:
    needs: plan
    if: needs.plan.result == 'success'
    runs-on: [self-hosted, linux, homelab, tailnet]
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.target_sha }}

      - name: Read Docker Hub credentials from Vault
        run: |
          set -euo pipefail
          set -a; source ~/actions-runner/.env; set +a
          DOCKERHUB_USERNAME=$(vault kv get -field=dockerhub_username secret/asw-cd)
          DOCKERHUB_TOKEN=$(vault kv get -field=dockerhub_token secret/asw-cd)
          echo "::add-mask::$DOCKERHUB_TOKEN"
          {
            echo "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME"
            echo "DOCKERHUB_TOKEN=$DOCKERHUB_TOKEN"
          } >> "$GITHUB_ENV"

      - name: docker login
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build + push app and nginx images
        run: |
          set -euo pipefail
          SHA="${{ needs.plan.outputs.target_sha }}"
          docker build --target runtime -t docker.io/tttaufiqqq/animal-shelter-workshop:"$SHA" .
          docker build --target nginx -t docker.io/tttaufiqqq/animal-shelter-workshop-nginx:"$SHA" .
          docker push docker.io/tttaufiqqq/animal-shelter-workshop:"$SHA"
          docker push docker.io/tttaufiqqq/animal-shelter-workshop-nginx:"$SHA"

      - name: Bump image tags in k8s manifests
        id: bump
        run: |
          set -euo pipefail
          SHA="${{ needs.plan.outputs.target_sha }}"
          sed -i "s|image: docker.io/tttaufiqqq/animal-shelter-workshop:.*|image: docker.io/tttaufiqqq/animal-shelter-workshop:${SHA}|" k8s/deployment.yaml
          sed -i "s|image: docker.io/tttaufiqqq/animal-shelter-workshop-nginx:.*|image: docker.io/tttaufiqqq/animal-shelter-workshop-nginx:${SHA}|" k8s/nginx-deployment.yaml
          if git diff --quiet k8s/deployment.yaml k8s/nginx-deployment.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit + push tag bump
        if: steps.bump.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml k8s/nginx-deployment.yaml
          git commit -m "chore(k8s): bump asw-app/asw-nginx image tags to ${{ needs.plan.outputs.target_sha }} [skip ci]"
          git push origin HEAD:main

      - name: docker logout
        if: always()
        run: docker logout || true

  # Runs the 5 DB playbooks only when infra_db routing says a linux-*.yml
  # playbook (or a shared group_var) actually changed. No rollback here —
  # there's no sane automatic reversal of an apt install or a UFW change on a
  # live DB host. This job fails loud and halts the pipeline: "fully
  # automated" means "automatically halts" here, not "automatically undoes".
  # See docs/12-cd.md.
  deploy-db:
    needs: plan
    if: needs.plan.outputs.infra_db == 'true'
    runs-on: [self-hosted, linux, homelab, tailnet]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.target_sha }}

      - name: Read CD secrets from Vault
        run: |
          set -euo pipefail
          set -a; source ~/actions-runner/.env; set +a
          BECOME_PASS=$(vault kv get -field=become_password secret/asw-cd)
          SSH_KEY=$(vault kv get -field=ssh_private_key secret/asw-cd)
          ROLE_ID=$(vault kv get -field=vault_role_id secret/asw-cd)
          SECRET_ID=$(vault kv get -field=vault_secret_id secret/asw-cd)
          for v in "$BECOME_PASS" "$ROLE_ID" "$SECRET_ID"; do
            echo "::add-mask::$v"
          done
          mkdir -p "$RUNNER_TEMP/cd"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/cd/cd_key"
          chmod 600 "$RUNNER_TEMP/cd/cd_key"
          {
            echo "ANSIBLE_BECOME_PASS=$BECOME_PASS"
            echo "VAULT_ROLE_ID=$ROLE_ID"
            echo "VAULT_SECRET_ID=$SECRET_ID"
          } >> "$GITHUB_ENV"

      # KNOWN GAP, left honest rather than papered over: the pre-deploy
      # backup step that used to run here (php artisan db:backup,
      # docs/10-backups.md) was invoked via a one-shot Vault Agent config
      # (agent-backup.hcl) that only ever existed on app-server's own
      # filesystem, tied to its `taufiq` user setup. It went away with
      # app-server itself and hasn't been re-homed anywhere yet (a k3s
      # CronJob or a pod-exec equivalent are both plausible, neither
      # built/tested) — tracked as follow-up work, not invented here
      # untested. This job now provisions the 5 DB hosts without a
      # fresh pre-deploy backup in hand until that's addressed.
      # --limit databases (inventory-ip.yml's group of the 3 mysql/mariadb/
      # postgres groups).
      - name: Provision the 5 database servers
        working-directory: infrastructure/ansible
        run: |
          ansible-playbook -i inventory-ip.yml --private-key "$RUNNER_TEMP/cd/cd_key" \
            --limit databases \
            playbooks/site.yml

      - name: Clean up temp SSH key
        if: always()
        run: shred -u "$RUNNER_TEMP/cd/cd_key" 2>/dev/null || rm -f "$RUNNER_TEMP/cd/cd_key"
