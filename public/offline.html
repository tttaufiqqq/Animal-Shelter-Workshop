<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Animal Shelter Workshop</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(180deg, #7e22ce, #581c87);
            color: #fff;
            text-align: center;
        }
        .card { padding: 2rem; }
        .paw { font-size: 3rem; }
        h1 { margin: 0.5rem 0; font-size: 1.5rem; }
        p { color: #e9d5ff; }
        button {
            margin-top: 1rem;
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            background: #fff;
            color: #6b21a8;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="paw">🐾</div>
        <h1>You're offline</h1>
        <p>Animal Shelter Workshop needs a connection to reach the shelter's servers.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
