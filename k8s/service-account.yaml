# Dedicated ServiceAccount for asw-app pods, bound to Vault's asw-app
# Kubernetes-auth role (secret/animal-shelter-workshop, read-only, same
# asw-deploy policy the Ansible AppRole deploy already uses).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: asw-app
---
# Same pattern, dedicated to the cloudflared Deployment (plan 06 Stage 5) —
# bound to Vault's cloudflared Kubernetes-auth role, same asw-deploy policy,
# only used to read cloudflare_tunnel_token from the same secret path.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared
