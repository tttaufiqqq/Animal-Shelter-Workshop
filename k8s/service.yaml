# k3s multi-node split (plans/06-k3s-multi-node-gitops-automation-plan):
# split into 2 Services, one per Deployment. A new name for each rather
# than reusing the old "asw-app" NodePort Service in place — an in-place
# NodePort->ClusterIP type change isn't something kubectl apply/ArgoCD can
# do cleanly. ArgoCD prunes the old "asw-app" Service automatically once
# it's no longer in this directory.
apiVersion: v1
kind: Service
metadata:
  name: asw-app-internal
spec:
  type: ClusterIP
  selector:
    app: asw-app
  ports:
    - port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: asw-nginx
spec:
  type: NodePort
  selector:
    app: asw-nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
