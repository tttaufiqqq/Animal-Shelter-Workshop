# Same vhost as docker/nginx/default.conf (Stage 4). Originally targeted
# localhost (app+nginx sidecar, shared Pod network namespace); after the
# k3s multi-node split (plans/06-k3s-multi-node-gitops-automation-plan)
# app and nginx are separate Deployments on separate nodes, so
# fastcgi_pass targets asw-app-internal's ClusterIP Service instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: asw-nginx-config
data:
  default.conf: |
    server {
        listen 80;
        not_a_real_directive on;
        index index.php;
        root /var/www/html/public;

        charset utf-8;

        client_max_body_size 30M;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass asw-app-internal.default.svc.cluster.local:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
