# k3s multi-node split (plans/06-k3s-multi-node-gitops-automation-plan):
# app (php-fpm) and nginx are now separate Deployments on separate nodes,
# each with its own image — no more same-Pod sidecar, no more
# initContainer/emptyDir asset handoff (nginx gets public/ baked into its
# own image at build time instead, see Dockerfile's `nginx` stage and
# nginx-deployment.yaml). nodeSelector pins this Deployment to node 1
# (linux-k3s) so the split is real, not just left to the scheduler.
#
# DB1-5_PASSWORD and APP_KEY are real production secrets, injected live by
# the Vault Agent Injector (already installed on this cluster, see
# docs/19-devops-practice/05) from secret/animal-shelter-workshop — the
# same path/policy (asw-deploy) the Ansible AppRole deploy already reads,
# now also readable by this Deployment's own asw-app ServiceAccount via a
# dedicated Kubernetes-auth role. Never hardcoded, never in the
# ConfigMap/Secret. The app container's command is overridden to source
# the injected file before exec'ing php-fpm, since the Injector only
# writes to a shared file, not directly into another container's env.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asw-app
spec:
  replicas: 3
  # node 1 (linux-k3s) is a single-core CT — the default RollingUpdate
  # (maxSurge=25%) tries to schedule a 4th pod before retiring an old one,
  # which can never fit (3 replicas + the Vault injector sidecar already
  # use ~95% of the node's 1 CPU). maxSurge: 0 forces retire-then-create
  # instead, which fits.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: asw-app
  template:
    metadata:
      labels:
        app: asw-app
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "asw-app"
        # One Vault read already returns every asw_secrets field — db.env
        # only ever covered DB passwords + APP_KEY (plan 05 scope). Extended
        # here (plan 07 Stage 2) to cover the rest: Cloudinary, mail,
        # ToyyibPay, Azure backup. Same file, same template, just more
        # fields — not a new Vault policy.
        vault.hashicorp.com/agent-inject-secret-db.env: "secret/data/animal-shelter-workshop"
        vault.hashicorp.com/agent-inject-template-db.env: |
          {{- with secret "secret/data/animal-shelter-workshop" -}}
          export APP_KEY="{{ .Data.data.app_key }}"
          export DB1_PASSWORD="{{ .Data.data.db_password }}"
          export DB2_PASSWORD="{{ .Data.data.db_password }}"
          export DB3_PASSWORD="{{ .Data.data.db_password }}"
          export DB4_PASSWORD="{{ .Data.data.db_password }}"
          export DB5_PASSWORD="{{ .Data.data.db_password }}"
          export CLOUDINARY_URL="{{ .Data.data.cloudinary_url }}"
          export CLOUDINARY_CLOUD_NAME="{{ .Data.data.cloudinary_cloud_name }}"
          export CLOUDINARY_API_KEY="{{ .Data.data.cloudinary_api_key }}"
          export CLOUDINARY_API_SECRET="{{ .Data.data.cloudinary_api_secret }}"
          export TOYYIBPAY_KEY="{{ .Data.data.toyyibpay_key }}"
          export TOYYIBPAY_CATEGORY="{{ .Data.data.toyyibpay_category }}"
          export MAIL_PASSWORD="{{ .Data.data.mail_password }}"
          export AZURE_BACKUP_SAS_TOKEN="{{ .Data.data.azure_backup_sas_token }}"
          export AZURE_BACKUP_CONTAINER_URL="{{ .Data.data.azure_backup_container_url }}"
          {{- end }}
    spec:
      serviceAccountName: asw-app
      nodeSelector:
        kubernetes.io/hostname: linux-k3s
      containers:
        - name: app
          image: docker.io/tttaufiqqq/animal-shelter-workshop:984a2d84b1622eb99e847caee1f73e7cdc8eee33
          command: ["sh", "-c"]
          args:
            - ". /vault/secrets/db.env && exec php-fpm"
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: asw-app-config
            - secretRef:
                name: asw-app-secret
